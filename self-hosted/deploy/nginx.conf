# Standalone configuration; never include in /etc/nginx/nginx.conf.
pid /var/lib/beiqiang/gateway/nginx.pid;
error_log /var/log/beiqiang/gateway-error.log warn;
worker_processes 1;
user www-data;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /var/lib/beiqiang/gateway/body;
  proxy_temp_path /var/lib/beiqiang/gateway/proxy;
  client_max_body_size 16m;
  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/beiqiang/tls/fullchain.pem;
    ssl_certificate_key /etc/beiqiang/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://127.0.0.1:8787;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 120s;
    }
  }
}
